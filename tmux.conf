unbind r
bind r source-file ~/.config/tmux/tmux.conf
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#latest'

# Catppuccin config
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'basic'

# Show the running program instead of the (often long) pane title
set -g @catppuccin_window_text ' #{pane_current_command}'
set -g @catppuccin_window_current_text ' #{pane_current_command}'

# Active window highlight uses Rose Pine's "iris" accent instead of mauve
set -g @catppuccin_window_current_number_color '#c4a7e7'

# Drop the powerline glyph before each status module - it doesn't render
# full-height in most fonts
set -g @catppuccin_status_left_separator ''

# Use @ instead of the default session icon, padded so it isn't a single
# cramped character
set -g @catppuccin_session_icon ' @ '
set -g @catppuccin_status_session_icon_fg 'white'
set -g @catppuccin_status_session_icon_bg '#0d0d0d'

# Session name blends into the status line instead of a separate box
set -g @catppuccin_status_session_text_bg '#{@thm_mantle}'

# Hostname module without its icon
set -g @catppuccin_host_icon ''

# tmux's built-in separator between windows defaults to an odd nerd-font
# glyph on this system - keep it a plain space instead
set -g window-status-separator ' '

set -g status-position bottom

# Other examples:

# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Status line modules (must be set after the catppuccin plugin has loaded)
set -g status-right-length 100
set -g status-left-length 100

# Session block (icon set to @ above) before the window list, with a plain
# divider separating it from the windows
set -g status-left '#{E:@catppuccin_status_session}#[fg=#{@thm_overlay_0}]│#[default] '

set -g status-right '#{E:@catppuccin_status_host}'

